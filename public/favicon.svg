<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="32" height="32">
  <!-- Retro 90s Pixel Movie Clapperboard Favicon (Emanuel's Reviews) -->

  <!-- Top Angled Clapper Arm -->
  <!-- Outline -->
  <path d="M 6,5 L 26,2 L 27,6 L 7,9 Z" fill="#000000" />
  <!-- Angled Stripes -->
  <!-- White Stripe 1 -->
  <polygon points="7,5 11,4 12,8 8,9" fill="#FFFFFF" />
  <!-- Black Stripe 1 -->
  <polygon points="11,4 15,3 16,7 12,8" fill="#1A1A1A" />
  <!-- White Stripe 2 -->
  <polygon points="15,3 19,2.5 20,6.5 16,7" fill="#FFFFFF" />
  <!-- Black Stripe 2 -->
  <polygon points="19,2.5 23,2 24,6 20,6.5" fill="#1A1A1A" />
  <!-- White Stripe 3 -->
  <polygon points="23,2 26,1.5 27,5.5 24,6" fill="#FFFFFF" />

  <!-- Lower Clapper Stick (Horizontal) -->
  <!-- Black border -->
  <rect x="3" y="9" width="26" height="5" fill="#000000" />
  <!-- Stripes -->
  <rect x="4" y="10" width="4" height="3" fill="#FFFFFF" />
  <rect x="8" y="10" width="4" height="3" fill="#1A1A1A" />
  <rect x="12" y="10" width="4" height="3" fill="#FFFFFF" />
  <rect x="16" y="10" width="4" height="3" fill="#1A1A1A" />
  <rect x="20" y="10" width="4" height="3" fill="#FFFFFF" />
  <rect x="24" y="10" width="4" height="3" fill="#1A1A1A" />

  <!-- Clapper Slate Body -->
  <!-- Outer border -->
  <rect x="3" y="13" width="26" height="17" fill="#000000" />
  <!-- 90s Beveled Inner Body -->
  <!-- Slate Fill -->
  <rect x="4" y="14" width="24" height="15" fill="#202227" />
  <!-- 3D Bevel Highlight (top and left edges) -->
  <rect x="4" y="14" width="24" height="1" fill="#4B5563" />
  <rect x="4" y="14" width="1" height="15" fill="#4B5563" />
  <!-- 3D Bevel Shadow (bottom and right edges) -->
  <rect x="4" y="28" width="24" height="1" fill="#0F1115" />
  <rect x="27" y="14" width="1" height="15" fill="#0F1115" />

  <!-- Hinge Pin -->
  <rect x="3" y="9" width="2" height="3" fill="#D1D5DB" />
  <rect x="4" y="10" width="1" height="1" fill="#FFFFFF" />

  <!-- Retro Pixel Red 'E' (Emanuel's Branding) -->
  <!-- 'E' Black Shadow / Backing for crisp pop -->
  <rect x="7" y="16" width="9" height="11" fill="#000000" />
  <rect x="11" y="18" width="5" height="2" fill="#202227" />
  <rect x="11" y="22" width="5" height="3" fill="#202227" />

  <!-- 'E' Main Red Fill -->
  <rect x="7" y="16" width="3" height="10" fill="#DC2626" />
  <rect x="7" y="16" width="8" height="3" fill="#DC2626" />
  <rect x="7" y="20" width="6" height="2" fill="#DC2626" />
  <rect x="7" y="23" width="8" height="3" fill="#DC2626" />

  <!-- 'E' 90s Bevel / Specular Highlights -->
  <rect x="7" y="16" width="8" height="1" fill="#F87171" />
  <rect x="7" y="16" width="1" height="10" fill="#F87171" />
  <rect x="7" y="20" width="6" height="1" fill="#F87171" />
  <rect x="7" y="23" width="8" height="1" fill="#F87171" />
  <!-- 'E' Dark Shading -->
  <rect x="9" y="18" width="6" height="1" fill="#991B1B" />
  <rect x="7" y="25" width="8" height="1" fill="#991B1B" />
  <rect x="9" y="21" width="4" height="1" fill="#991B1B" />

  <!-- Retro Pixel Gold Cinema Star -->
  <!-- Star Black Outline -->
  <rect x="20" y="17" width="3" height="1" fill="#000000" />
  <rect x="19" y="18" width="5" height="1" fill="#000000" />
  <rect x="17" y="19" width="9" height="1" fill="#000000" />
  <rect x="18" y="20" width="7" height="1" fill="#000000" />
  <rect x="19" y="21" width="5" height="1" fill="#000000" />
  <rect x="18" y="22" width="2" height="2" fill="#000000" />
  <rect x="23" y="22" width="2" height="2" fill="#000000" />

  <!-- Star Gold Fill -->
  <rect x="21" y="18" width="1" height="1" fill="#FBBF24" />
  <rect x="18" y="19" width="7" height="1" fill="#FBBF24" />
  <rect x="19" y="20" width="5" height="1" fill="#FBBF24" />
  <rect x="20" y="21" width="3" height="1" fill="#F59E0B" />
  <rect x="19" y="22" width="1" height="1" fill="#D97706" />
  <rect x="23" y="22" width="1" height="1" fill="#D97706" />
  <!-- Star Sparkle Highlight -->
  <rect x="21" y="19" width="1" height="1" fill="#FEF08A" />

  <!-- Retro Slate Chalk Detail: '98 (Est. 1998) -->
  <rect x="18" y="25" width="8" height="1" fill="#475569" />
  <!-- '9' -->
  <rect x="18" y="26" width="2" height="2" fill="#94A3B8" />
  <rect x="19" y="27" width="1" height="2" fill="#94A3B8" />
  <!-- '8' -->
  <rect x="22" y="26" width="2" height="1" fill="#94A3B8" />
  <rect x="22" y="27" width="2" height="1" fill="#94A3B8" />
  <rect x="22" y="28" width="2" height="1" fill="#94A3B8" />
</svg>